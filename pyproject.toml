[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-bot"
version = "1.0.0"
description = "Multi-agent PR review bot using CrewAI"
requires-python = ">=3.10"
dependencies = [
    "crewai",
    "langchain-openai",
    "python-dotenv",
    "click>=8.1",
    "httpx",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
pr-review = "cli:cli"

[tool.setuptools.packages.find]
include = ["agents*", "tasks*", "config*", "github_utils*", "webhook*"]

[tool.setuptools]
py-modules = ["cli", "kb_loader", "engine", "review_parser", "requirements_extractor"]

[tool.setuptools.package-dir]
"" = "."
